spring.application.name=mindtrack-backend

# Database Configuration
# Set SPRING_DATASOURCE_PASSWORD as an environment variable before running
spring.datasource.url=jdbc:postgresql://localhost:5432/mindtrack_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Set JWT_SECRET as an environment variable (256-bit hex, e.g.: openssl rand -hex 32)
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000
